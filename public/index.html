```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        h1 {
            color: #243b64;
            margin-bottom: 8px;
        }

        header p {
            color: #666;
        }

        button {
            background: #3157d5;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #2343ae;
        }

        .form-card,
        .project-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
            margin-bottom: 22px;
        }

        .form-card h2,
        .projects-heading {
            margin-bottom: 18px;
            color: #243b64;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
        }

        .cancel-button {
            background: #777;
        }

        .cancel-button:hover {
            background: #555;
        }

        .hidden {
            display: none;
        }

        #message {
            margin-top: 12px;
            color: #217a3c;
        }

        #empty-state {
            background: white;
            text-align: center;
            padding: 35px 20px;
            border-radius: 10px;
            color: #666;
            border: 1px dashed #bbb;
        }

        #project-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .project-card {
            margin-bottom: 0;
        }

        .project-card h3 {
            color: #243b64;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e8edff;
            color: #3157d5;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .project-card p {
            color: #666;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <div>
                <h1>Student Project Tracker</h1>
                <p>Manage and track your academic projects in one place.</p>
            </div>

            <button id="add-project-button" type="button"
                onclick="document.getElementById('project-form').classList.toggle('hidden')">
                + Add Project
            </button>
        </header>

        <section id="project-form" class="form-card hidden">
            <h2>Add a New Project</h2>

            <form id="add-project-form">
                <div class="form-group">
                    <label for="name">Project Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your project name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">Project Status</label>
                    <select id="status" name="status" required>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="form-buttons">
                    <button type="submit">Save Project</button>
                    <button type="button" id="cancel-button"
                        class="cancel-button"
                        onclick="document.getElementById('project-form').classList.add('hidden')">
                        Cancel
                    </button>
                </div>

                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section>
            <h2 class="projects-heading">My Projects</h2>

            <div id="empty-state">
                <h3>No projects added yet</h3>
                <p>Click “Add Project” to create your first project.</p>
            </div>

            <div id="project-list"></div>
        </section>

        <footer>
            Student Project Tracker | Academic Project Management
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
